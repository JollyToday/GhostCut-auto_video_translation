app:
  name: "Weydub: try Pro subtitle removal"
  description: "Use an authorized H.264 MP4 up to 60 seconds and 16 MiB. Full-frame detection can also erase signs and prices. No API key. All anonymous channels share 100 slots per UTC month; no paid fallback."
  mode: workflow
  icon: "\U0001F3AC"
  icon_background: "#E5EFFF"
kind: app
version: 0.7.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    viewport: {x: 0, y: 0, zoom: 0.7}
    edges:
      - {id: validate, source: '100', sourceHandle: source, target: '200', targetHandle: target, type: custom, data: {sourceType: start, targetType: code}}
      - {id: route, source: '200', sourceHandle: source, target: '300', targetHandle: target, type: custom, data: {sourceType: code, targetType: if-else}}
      - {id: upload, source: '300', sourceHandle: 'true', target: '410', targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check, source: '300', sourceHandle: check, target: '420', targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: receipt, source: '300', sourceHandle: 'false', target: '430', targetHandle: target, type: custom, data: {sourceType: if-else, targetType: end}}
      - {id: uploaded, source: '410', sourceHandle: source, target: '500', targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code}}
      - {id: explain, source: '500', sourceHandle: source, target: '510', targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
      - {id: checked, source: '420', sourceHandle: source, target: '520', targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code}}
      - {id: result, source: '520', sourceHandle: source, target: '620', targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
    nodes:
      - id: '100'
        type: custom
        position: {x: 0, y: 180}
        data:
          type: start
          title: Select an action
          variables:
            - {variable: action, label: Action, type: select, required: true, options: [Create a private receipt, Submit my authorized clip to Weydub, Check my result], default: Create a private receipt}
            - {variable: receipt, label: Private receipt (submit or check), type: text-input, max_length: 64, required: false, options: []}
            - {variable: clip, label: H.264 MP4 (submit only), type: file, required: false, allowed_file_types: [video], allowed_file_extensions: [.MP4], allowed_file_upload_methods: [local_file], options: []}
      - id: '200'
        type: custom
        position: {x: 290, y: 180}
        data:
          type: code
          title: Prepare or verify receipt
          code_language: python3
          variables:
            - {variable: action, value_selector: ['100', action]}
            - {variable: receipt, value_selector: ['100', receipt]}
          outputs:
            key: {type: string, children: null}
            operation: {type: string, children: null}
          code: |
            def main(action, receipt=None):
                import re, secrets
                key = (receipt or "").strip()
                if action == "Create a private receipt":
                    if key:
                        raise ValueError("Keep your existing receipt. Select Check my result or Submit my authorized clip to Weydub.")
                    return {"key": secrets.token_hex(32), "operation": "prepare"}
                actions = {"Submit my authorized clip to Weydub": "upload", "Check my result": "check"}
                if action not in actions or not re.fullmatch(r"[0-9a-f]{64}", key):
                    raise ValueError("Select an action and enter the full private receipt. First time? Create a private receipt first.")
                return {"key": key, "operation": actions[action]}
      - id: '300'
        type: custom
        position: {x: 580, y: 180}
        data:
          type: if-else
          title: Send only on explicit submit
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: is-upload, comparison_operator: is, varType: string, variable_selector: ['200', operation], value: upload}
            - case_id: check
              logical_operator: and
              conditions:
                - {id: is-check, comparison_operator: is, varType: string, variable_selector: ['200', operation], value: check}
      - id: '410'
        type: custom
        position: {x: 900, y: 30}
        data:
          type: http-request
          title: Upload this MP4
          method: post
          url: https://api.weydub.com/agent-trial/v1/removal
          authorization: {type: no-auth}
          headers: |-
            Content-Type:video/mp4
            X-Trial-Receipt:{{#200.key#}}
          params: ''
          body: {type: binary, data: [{type: file, file: ['100', clip]}]}
          timeout: {connect: 10, read: 60, write: 60}
          ssl_verify: true
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
      - id: '420'
        type: custom
        position: {x: 900, y: 190}
        data:
          type: http-request
          title: Look up the same receipt
          method: get
          url: https://api.weydub.com/agent-trial/v1/removal
          authorization: {type: no-auth}
          headers: "X-Trial-Receipt:{{#200.key#}}"
          params: ''
          body: {type: none, data: []}
          timeout: {connect: 10, read: 30, write: 30}
          ssl_verify: true
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
      - id: '430'
        type: custom
        position: {x: 900, y: 350}
        data:
          type: end
          title: Save this receipt before uploading
          outputs: [{variable: private_receipt, value_type: string, value_selector: ['200', key]}]
      - id: '500'
        type: custom
        position: {x: 1210, y: 30}
        data:
          type: code
          title: Read submission status
          code_language: python3
          variables:
            - {variable: body, value_selector: ['410', body]}
            - {variable: code, value_selector: ['410', status_code]}
          outputs:
            state: {type: string, children: null}
            message: {type: string, children: null}
          code: |
            def main(body, code):
                import json
                try:
                    data = json.loads(body)
                except (TypeError, ValueError):
                    data = {}
                state = data.get("state") if isinstance(data, dict) else None
                if code not in (200, 202) or state not in ("queued", "submitting", "processing", "ready", "failed", "needs_review", "expired"):
                    hints = {409: "This receipt belongs to another clip. Check the original receipt for its result.",
                             413: "Choose one MP4 no larger than 16 MiB and no longer than 60 seconds.",
                             415: "Choose an H.264 MP4 with optional AAC audio.",
                             422: "Check that the clip is a playable H.264 MP4 of up to 60 seconds and 16 MiB, with optional AAC audio.",
                             429: "The shared trial is unavailable. Keep this receipt and try later. No paid job was started."}
                    return {"state": "not_confirmed", "message": hints.get(code, "Upload not confirmed. Select Check my result with the same receipt before retrying.")}
                if state in ("failed", "needs_review", "expired"):
                    return {"state": state, "message": "The job on this receipt is not available for download. Check its result before submitting again."}
                message = "This receipt already has a job." if data.get("replayed") else "Weydub accepted your clip."
                return {"state": state, "message": message + " Select Check my result and paste the same receipt."}
      - id: '510'
        type: custom
        position: {x: 1510, y: 30}
        data:
          type: end
          title: Submission response
          outputs:
            - {variable: state, value_type: string, value_selector: ['500', state]}
            - {variable: message, value_type: string, value_selector: ['500', message]}
      - id: '520'
        type: custom
        position: {x: 1210, y: 190}
        data:
          type: code
          title: Read status and private download link
          code_language: python3
          variables:
            - {variable: body, value_selector: ['420', body]}
            - {variable: code, value_selector: ['420', status_code]}
          outputs:
            message: {type: string, children: null}
            download_url: {type: string, children: null}
          code: |
            def main(body, code):
                import json
                from urllib.parse import urlsplit
                def answer(text, link=""):
                    return {"message": text, "download_url": link}
                try:
                    data = json.loads(body)
                except (ValueError, TypeError):
                    data = None
                if code == 404 and isinstance(data, dict) and data.get("error") == "Unknown receipt.":
                    return answer("No job found. Check the receipt you saved. If you have not submitted the clip, choose Submit my authorized clip to Weydub.")
                if code != 200 or not isinstance(data, dict):
                    return answer("Could not check this job. Keep your receipt and try Check my result again later.")
                state = data.get("state")
                if state != "ready":
                    messages = {"queued": "Queued. Check again with this receipt.", "submitting": "Starting. Check again with this receipt.", "processing": "Processing. Check again with this receipt.", "failed": "Processing failed. Keep the receipt for support.", "needs_review": "This job needs review. Keep the receipt for support.", "expired": "The result has expired. Check your saved downloads before starting another job."}
                    return answer(messages.get(state, "Unrecognized job status. Keep your receipt and check again later.") if isinstance(state, str) else "Could not read the job status. Try Check my result again later.")
                link = data.get("videoUrl")
                if isinstance(link, str) and not any(c.isspace() or ord(c) < 32 or c == "\\" for c in link):
                    try:
                        target = urlsplit(link)
                        if target.scheme == "https" and target.netloc.lower() == "gc70.cdn.izhaoli.cn" and target.path.strip("/"):
                            return answer("Your MP4 is ready.", link)
                    except ValueError:
                        pass
                return answer("Your job finished, but the download link could not be verified. Keep the receipt and contact Weydub support.")
      - id: '620'
        type: custom
        position: {x: 1510, y: 190}
        data:
          type: end
          title: Download your cleaned clip
          outputs:
            - {variable: message, value_type: string, value_selector: ['520', message]}
            - {variable: download_url, value_type: string, value_selector: ['520', download_url]}
