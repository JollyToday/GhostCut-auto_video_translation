app:
  name: "Weydub: check a subtitle removal"
  description: "Look up a previously submitted video. When it is ready, the result contains a private MP4 download link. Checking does not start a job."
  mode: workflow
  icon: "\U0001F3AC"
  icon_background: "#E5EFFF"
kind: app
version: 0.7.0
dependencies:
  - type: package
    value:
      plugin_unique_identifier: weydub/subtitle_removal:0.1.0@8b465728a4dc763ecd82e2a95ca2ca19784fa8e7ab1c79ca3b3c9fb4861803eb
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    viewport: {x: 0, y: 0, zoom: 0.8}
    edges:
      - {id: input-check, source: '100', sourceHandle: source, target: '200', targetHandle: target, type: custom, data: {sourceType: start, targetType: tool}}
      - {id: check-output, source: '200', sourceHandle: source, target: '300', targetHandle: target, type: custom, data: {sourceType: tool, targetType: end}}
    nodes:
      - id: '100'
        type: custom
        position: {x: 30, y: 120}
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: Existing job
          variables:
            - {label: Work ID, variable: work_id, type: text-input, required: true, max_length: 32, options: []}
      - id: '200'
        type: custom
        position: {x: 340, y: 120}
        sourcePosition: right
        targetPosition: left
        data:
          type: tool
          title: Check the original job
          provider_type: builtin
          provider_id: weydub/subtitle_removal/subtitle_removal
          provider_name: weydub/subtitle_removal/subtitle_removal
          tool_name: removal_result
          tool_label: Check removal result
          tool_node_version: '2'
          tool_configurations: {}
          tool_parameters:
            work_id: {type: variable, value: ['100', work_id]}
      - id: '300'
        type: custom
        position: {x: 650, y: 120}
        targetPosition: left
        sourcePosition: right
        data:
          type: end
          title: Status and download
          outputs:
            - {variable: state, value_type: string, value_selector: ['200', state]}
            - {variable: result, value_type: string, value_selector: ['200', text]}
